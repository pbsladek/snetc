[changelog]
header = "# Changelog\n"
body = """
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first | trim_end_matches(pat=".") }}\
{% if commit.breaking %} **(breaking)**{% endif %}

{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [
  { message = "(?i)^feat|(?i)^add|(?i)^new",           group = "Features"       },
  { message = "(?i)^fix|(?i)^bug",                      group = "Bug Fixes"      },
  { message = "(?i)^docs?|(?i)^readme",                 group = "Documentation"  },
  { message = "(?i)^refactor|(?i)^clean|(?i)^simplif",  group = "Refactoring"    },
  { message = "(?i)^test|(?i)^spec",                    group = "Tests"          },
  { message = "(?i)^chore|(?i)^build|(?i)^ci|(?i)^dep", group = "Maintenance"   },
  { message = ".*",                                      group = "Changes"        },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
