name: Container

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish
        required: true
        default: dev

env:
  IMAGE_NAME: pwbsladek/snetc

jobs:
  build:
    name: Build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            artifact: runtime-linux-amd64
            variant: runtime
            target: runtime
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            artifact: runtime-linux-arm64
            variant: runtime
            target: runtime
          - platform: linux/amd64
            runner: ubuntu-22.04
            artifact: tui-linux-amd64
            variant: tui
            target: tui-runtime
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            artifact: tui-linux-arm64
            variant: tui
            target: tui-runtime

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DHI_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=container-${{ matrix.artifact }}
          cache-to: type=gha,scope=container-${{ matrix.artifact }},mode=max
          provenance: true
          sbom: true

      - name: Smoke test pushed digest
        run: docker run --rm "${IMAGE_NAME}@${{ steps.build.outputs.digest }}" --help

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests/${{ matrix.variant }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${{ matrix.variant }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/${{ matrix.variant }}/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch tag
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download runtime digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/runtime
          pattern: digests-runtime-*
          merge-multiple: true

      - name: Download TUI digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/tui
          pattern: digests-tui-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create runtime manifest list
        working-directory: ${{ runner.temp }}/digests/runtime
        env:
          INPUT_TAG: ${{ inputs.tag || 'dev' }}
        run: |
          set -euo pipefail

          tags=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ref="${GITHUB_REF_NAME}"
            version="${ref#v}"
            tags=(-t "${IMAGE_NAME}:${ref}" -t "${IMAGE_NAME}:${version}" -t "${IMAGE_NAME}:latest")
          else
            tags=(-t "${IMAGE_NAME}:${INPUT_TAG}")
          fi

          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -eq 0 ]; then
            echo "No digest artifacts found in $(pwd)" >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Create TUI manifest list
        working-directory: ${{ runner.temp }}/digests/tui
        env:
          INPUT_TAG: ${{ inputs.tag || 'dev' }}
        run: |
          set -euo pipefail

          tags=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ref="${GITHUB_REF_NAME}"
            version="${ref#v}"
            tags=(-t "${IMAGE_NAME}:${ref}-tui" -t "${IMAGE_NAME}:${version}-tui" -t "${IMAGE_NAME}:latest-tui")
          else
            tags=(-t "${IMAGE_NAME}:${INPUT_TAG}-tui")
          fi

          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -eq 0 ]; then
            echo "No TUI digest artifacts found in $(pwd)" >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
